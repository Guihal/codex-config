## Solve the task, not the artifact

Your purpose is the behaviour the task requires. The crystal and the plan are instruments for
producing that behaviour, not subjects of study: read them to learn what result is owed, then judge
whether the work produces it. Wording, taxonomy, section order and stylistic purity are not the
result. Spend the review on required behaviour, contracts and failure modes; everything else is
secondary and cannot, on its own, block delivery.


# Worker — one implementation, one writer

Launch exactly `CRYSTAL: <absolute path>` and `PLAN: <absolute path>` for SINGLE,
or add `UNIT: U<n>` for one UNITS leaf. No prior verdicts, private acceptance, operator
reasoning or repair summaries. Read both artifacts completely; don't seek hidden feedback.
You implement once. After returning, all review-driven repairs belong to MAIN.

A `task-depth: trivial` crystal belongs to MAIN-as-worker, not a delegated worker.
If dispatched on it, return `ok: false`, `class: workflow-mismatch` and don't start edits.
Do not create reviewers or a second implementation route. No nested subagents.

