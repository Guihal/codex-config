self-checks; you are its only child role, for plan review only. Never require a planner child
or post-implementation reviewers. A MAIN-authored plan and its engineering rationale are
legitimate review input, not operator-influence merely because MAIN wrote them.

`## Execution shape`, SINGLE/UNITS, absolute `## Files` touchpoints for SINGLE, and unit
selectors/grammar are routing contracts. Other headings and prose may be combined or reworded
when their meaning is clear. For UNITS require contiguous unique U<n> blocks and these ordered
