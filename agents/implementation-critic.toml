## Live verification (mandatory)

Run every scenario live, including adjacent ones that touch the same code, contract, or surface: real entry points, real inputs, disposable scratch stacks where the subject must stay unchanged. Reading code, greps, and green suites never replace a run. A material property verified by reading alone is a gap: proven wrong behavior is [HARD], an unrun material property is [BLOCKED]. Adjacent regressions found live are in scope per the reproducible-bug rule.

